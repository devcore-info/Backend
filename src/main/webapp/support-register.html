<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Soporte - Connextion Helpdesk</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <h1>Registro de Personal</h1>
        <p class="subtitle">Crear cuenta administrativa para Soportistas y Supervisores</p>

        <!-- Dynamic alert display for success or error feedback -->
        <div id="alertBox" class="alert"></div>

        <form id="registerForm">
            <!-- Row for Name and First Surname -->
            <div class="form-row">
                <div class="form-group">
                    <label for="name">Nombre</label>
                    <input type="text" id="name" required placeholder="Ej. Juan">
                </div>
                <div class="form-group">
                    <label for="firstSurname">Primer Apellido</label>
                    <input type="text" id="firstSurname" required placeholder="Ej. Pérez">
                </div>
            </div>

            <!-- Second Surname and Email -->
            <div class="form-group">
                <label for="secondSurname">Segundo Apellido</label>
                <input type="text" id="secondSurname" required placeholder="Ej. Rodríguez">
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" required placeholder="nombre@connextion.com">
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••" minlength="6">
            </div>

            <!-- Role Dropdown -->
            <div class="form-group">
                <label for="roleSelect">Rol Administrativo</label>
                <select id="roleSelect" required>
                    <option value="false">Soportista Técnico</option>
                    <option value="true">Supervisor de Soporte</option>
                </select>
            </div>

            <!-- Support Services Checkboxes (Areas) -->
            <div class="form-group">
                <label>Áreas Tecnológicas de Soporte (Mínimo una)</label>
                <div class="areas-grid">
                    <div class="checkbox-container">
                        <input type="checkbox" name="services" id="service1" value="1">
                        <label for="service1">Telefonía móvil</label>
                    </div>
                    <div class="checkbox-container">
                        <input type="checkbox" name="services" id="service2" value="2">
                        <label for="service2">Cable</label>
                    </div>
                    <div class="checkbox-container">
                        <input type="checkbox" name="services" id="service3" value="3">
                        <label for="service3">Internet</label>
                    </div>
                    <div class="checkbox-container">
                        <input type="checkbox" name="services" id="service4" value="4">
                        <label for="service4">Telefonía fija</label>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn" id="submitBtn">Registrar Personal</button>
        </form>

        <p class="footer-text">
            ¿Ya tienes cuenta? <a href="support-login.html">Iniciar Sesión</a>
        </p>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const alertBox = document.getElementById('alertBox');
            const submitBtn = document.getElementById('submitBtn');

            // Reset alerts
            alertBox.style.display = 'none';
            alertBox.className = 'alert';
            alertBox.innerText = '';

            // Get form values
            const name = document.getElementById('name').value.trim();
            const firstSurname = document.getElementById('firstSurname').value.trim();
            const secondSurname = document.getElementById('secondSurname').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const isSupervisor = document.getElementById('roleSelect').value === 'true';

            // Collect selected services (IDs 1-4)
            const serviceCheckboxes = document.querySelectorAll('input[name="services"]:checked');
            const services = Array.from(serviceCheckboxes).map(cb => parseInt(cb.value, 10));

            // Validation: Ensure at least one service is selected
            if (services.length === 0) {
                showAlert('alert-error', 'Debe seleccionar al menos un área tecnológica de soporte.');
                return;
            }

            // Build request body
            const payload = {
                name,
                firstSurname,
                secondSurname,
                email,
                password,
                isSupervisor,
                services
            };

            // Disable submit button during call
            submitBtn.disabled = true;
            submitBtn.innerText = 'Registrando...';

            try {
                const response = await fetch('http://localhost:8080/Backend/resources/api/v1/support/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok || response.status === 201) {
                    showAlert('alert-success', data.message || 'Personal registrado exitosamente.');
                    document.getElementById('registerForm').reset();
                } else {
                    showAlert('alert-error', data.error || 'Error al registrar el personal.');
                }
            } catch (err) {
                console.error('Fetch error:', err);
                showAlert('alert-error', 'Error de conexión con el servidor. Por favor, asegúrese de que el backend esté ejecutándose.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Registrar Personal';
            }
        });

        function showAlert(typeClass, message) {
            const alertBox = document.getElementById('alertBox');
            alertBox.className = `alert ${typeClass}`;
            alertBox.innerText = message;
            alertBox.style.display = 'flex';
            
            // Scroll alert into view smoothly
            alertBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    </script>
</body>
</html>
