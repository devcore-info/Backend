# Spring Boot Configuration
server.port=8080

# Database Configuration (Microsoft SQL Server)
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:1433;databaseName=master;trustServerCertificate=true;loginTimeout=90
spring.datasource.username=sa
spring.datasource.password=16200122Wqkj!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# HikariCP Connection Pool - tolerate slow SQL Server startup
spring.datasource.hikari.connection-timeout=120000
spring.datasource.hikari.initialization-fail-timeout=120000
spring.datasource.hikari.maximum-pool-size=5

# Enable SQL script initialization (schema.sql and data.sql)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=true

# Logging level
logging.level.org.springframework.web=INFO
logging.level.org.springframework.jdbc=DEBUG
